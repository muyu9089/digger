<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>澄明 · 个人投资工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="login" class="login"><form id="login-form" class="login-card"><div class="brand-mark">澄</div><p class="eyebrow">PERSONAL INVESTMENT WORKSPACE</p><h1>让每个决定<br>都有据可循。</h1><p class="muted">澄明 · 你的个人投资工作台</p><label>登录密码<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">进入工作台 →</button><p id="login-error" role="alert"></p></form></div>
<div id="workspace" class="hidden shell"><aside><div class="brand"><span class="brand-mark">澄</span><div>澄明<small>个人投资工作台</small></div></div><nav id="nav" aria-label="主导航"></nav><div class="sidebar-bottom"><span class="status-dot"></span>个人账户 · 本地账本<button id="logout" class="quiet">退出登录</button></div></aside><div class="main"><header><div><span class="eyebrow">YOUR CAPITAL, WITH CLARITY</span><div id="breadcrumb">工作台 / 总览</div></div><div class="header-actions"><span id="clock"></span><button id="quick-entry">＋ 记一笔</button></div></header><main id="content"></main><footer>账本事实由程序计算 · 研究观点独立保存 · Asia/Shanghai</footer></div></div>
<dialog id="modal"><div class="dialog-header"><h2 id="modal-title"></h2><button id="modal-close" class="quiet" aria-label="关闭">×</button></div><div id="modal-body"></div></dialog><div id="toast" role="status" class="hidden"></div><script src="/app.js"></script>
</body></html>
